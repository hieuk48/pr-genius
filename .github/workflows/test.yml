name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # mcp requires Python >=3.10
          if python3 -c "import sys; assert sys.version_info >= (3,10)"; then
            pip install -e "prgenius[dev,mcp]"
          else
            pip install -e "prgenius[dev]"
          fi

      - name: Run tests
        run: |
          # mcp tests require Python >=3.10
          # 管线产物缺失的那 4 条已改成缺件跳过（见各测试的 docstring），
          # 不再需要 -k 掩码 —— 掩码顺带把 test_load_anti_patterns 也一起
          # 屏蔽了 11 条，其中 10 条本来就是好的。
          if python3 -c "import sys; assert sys.version_info >= (3,10)"; then
            python3 -m pytest prgenius/tests/ -v
          else
            python3 -m pytest prgenius/tests/ -v -k "not test_mcp"
          fi
